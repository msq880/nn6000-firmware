# LibWrt 云端编译（缓存版），2026-11-19 用户要求新建，与无缓存版 build-libwrt.yml 并存，
# 无缓存版保留不动。相对无缓存版的差异只有四处：
#  1. apt 加装 ccache；
#  2. Clone 之后用 actions/cache@v4 恢复 dl/ 与 openwrt-src/.ccache 两个缓存，key 跟
#     configs/libwrt.config 的内容哈希走，并带 restore-keys 前缀回退（改配置先拉旧缓存打底）；
#     （2026-11-19 首轮验证发现：LibWrt 默认 CCACHE_DIR=$(TOPDIR)/.ccache，编译缓存实际写在
#      源码目录内，原先写的 ~/.ccache 始终为空、保存被跳过，已修正为 openwrt-src/.ccache。）
#  3. Load config 时追加 CONFIG_DEVEL=y 与 CONFIG_CCACHE=y（2026-11-19 本地实测确认：
#     CONFIG_CCACHE 在 Config-devel.in 里挂在 DEVEL 之下、单独追加会被 make defconfig
#     直接丢弃，前两轮 ccache 从未启用、目录根本没生成；必须先开 DEVEL 才能保留 CCACHE）；
#  4. Release 标签带 -cache 后缀，与无缓存版的 -run<N> 区分、避免撞名。
# 缓存存于 GitHub 的 Actions 缓存服务（每仓库 10GB），缓存缺失/被淘汰时自动退化为全量编译，不影响构建本身。
name: Build LibWrt NN6000V2 (Cache)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget libelf-dev zstd ccache

      - name: Clone LibWrt source
        run: git clone --depth 1 https://github.com/LiBwrt/LibWrt openwrt-src

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: openwrt-src/dl
          key: libwrt-dl-${{ hashFiles('configs/libwrt.config') }}
          restore-keys: |
            libwrt-dl-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: openwrt-src/.ccache
          key: libwrt-ccache-${{ hashFiles('configs/libwrt.config') }}
          restore-keys: |
            libwrt-ccache-

      - name: Seed dl cache
        working-directory: openwrt-src
        run: |
          mkdir -p dl
          cp "$GITHUB_WORKSPACE"/dl/*.tar.gz dl/ 2>/dev/null || true
          ls -lh dl/

      - name: Add extra feeds
        working-directory: openwrt-src
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/OpenWrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/OpenWrt-Passwall/openwrt-passwall.git;main
          EOF
          cat feeds.conf.default

      - name: Add Lucky packages
        working-directory: openwrt-src
        run: |
          git clone --depth 1 https://github.com/kenzok8/small-package.git /tmp/small-package
          cp -r /tmp/small-package/lucky package/
          cp -r /tmp/small-package/luci-app-lucky package/
          ls package/lucky package/luci-app-lucky

      - name: Add Argon config package
        working-directory: openwrt-src
        run: |
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          ls package/luci-app-argon-config

      - name: Add MosDNS packages
        working-directory: openwrt-src
        run: |
          git clone --depth 1 -b v5 https://github.com/sbwml/luci-app-mosdns.git /tmp/mosdns-repo
          cp -r /tmp/mosdns-repo/mosdns package/
          cp -r /tmp/mosdns-repo/luci-app-mosdns package/
          cp -r /tmp/mosdns-repo/geo2txt package/
          ls package/mosdns package/luci-app-mosdns package/geo2txt

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        working-directory: openwrt-src
        run: |
          cp "$GITHUB_WORKSPACE/configs/libwrt.config" .config
          grep -q '^CONFIG_DEVEL' .config || echo 'CONFIG_DEVEL=y' >> .config
          grep -q '^CONFIG_CCACHE' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        run: make download -j8

      - name: Compile firmware
        working-directory: openwrt-src
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect firmware files
        run: |
          mkdir -p firmware
          find openwrt-src/bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -name '*nn6000-v2*' -exec cp -v {} firmware/ \;
          ls -lh firmware/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-NN6000V2
          path: firmware/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="libwrt-nn6000v2-$(date +%Y%m%d)-cache${{ github.run_number }}"
          gh release create "$tag" firmware/* \
            --title "LibWrt NN6000V2 $tag" \
            --notes "LibWrt (LiBwrt/LibWrt) for Link NN6000 V2, full package set: Lucky, PassWall, Argon theme, MosDNS, ttyd, WireGuard, KMS and more. Rootfs 2GB, kernel 6MB. factory.bin = U-Boot first flash, sysupgrade.bin = upgrade from OpenWrt/ImmortalWrt. Built with the cache-enabled workflow (dl + ccache)."
