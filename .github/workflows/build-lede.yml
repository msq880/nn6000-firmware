name: Build LEDE NN6000V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/lede.config'
      - '.github/workflows/build-lede.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget libelf-dev zstd

      - name: Clone LEDE source
        run: git clone --depth 1 -b master https://github.com/coolsnowwolf/lede openwrt-src

      - name: Seed dl cache
        working-directory: openwrt-src
        run: |
          mkdir -p dl
          cp "$GITHUB_WORKSPACE"/dl/*.tar.gz dl/ 2>/dev/null || true
          ls -lh dl/

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        working-directory: openwrt-src
        run: |
          cp "$GITHUB_WORKSPACE/configs/lede.config" .config
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        run: make download -j8

      - name: Compile firmware
        working-directory: openwrt-src
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect firmware files
        run: |
          mkdir -p firmware
          find openwrt-src/bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -name '*nn6000-v2*' -exec cp -v {} firmware/ \;
          ls -lh firmware/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDE-NN6000V2
          path: firmware/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="lede-nn6000v2-$(date +%Y%m%d)-run${{ github.run_number }}"
          gh release create "$tag" firmware/* \
            --title "LEDE NN6000V2 $tag" \
            --notes "LEDE (coolsnowwolf/lede master) for Link NN6000 V2. factory.bin = U-Boot first flash, sysupgrade.bin = upgrade from OpenWrt/ImmortalWrt. Kernel 6MB."
