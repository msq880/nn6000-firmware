name: Cleanup Workspace (Local)

# Utility: wipe the local build leftovers (source tree, config clone,
# firmware output, probe dir) from the self-hosted runner workspace.
# Manual dispatch only.

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Report host state
        run: |
          echo "== docker ps =="; docker ps --format '{{.ID}} {{.Image}} {{.Status}} {{.Names}}' || true
          echo "== memory =="; free -h | head -2
          echo "== workspace =="; ls -la "$GITHUB_WORKSPACE" || true
          echo "== disk =="; df -h "$GITHUB_WORKSPACE" | tail -1

  clean:
    needs: report
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ubuntu:24.04
    steps:
      - name: Remove build leftovers
        run: |
          rm -rf "$GITHUB_WORKSPACE/openwrt-src" "$GITHUB_WORKSPACE/cfg-repo" "$GITHUB_WORKSPACE/firmware" "$GITHUB_WORKSPACE/.persist-probe"
          echo "== after cleanup =="; ls -la "$GITHUB_WORKSPACE"
          df -h "$GITHUB_WORKSPACE" | tail -1
