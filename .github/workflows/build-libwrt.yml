# LibWrt 云端编译（无缓存版，三版本合一）：2026-11-20 用户要求双版本合并，
# 2026-11-23 再增加第三版（无 WiFi + Docker）。一次运行里在同一棵源码树上连编三个版本：
# 标准版（configs/libwrt.config，带 WiFi）→ 无 WiFi 版（configs/libwrt-nowifi.config）
# → 无 WiFi + Docker 版（configs/libwrt-nowifi-docker.config）。后续编译复用前面的成果：
# dl/ 源码包不重下、工具链与 host 工具不重编、未受配置影响的软件包不重编，
# 只重编内核/模块与受影响部分（实测第二版仅约 6 分钟），总耗时明显小于分开跑三次。
# 换配置前必须清掉 rootfs 暂存区（staging_dir/target-*/root-* 与 build_dir/target-*/root-*），
# 否则上一版装进根文件系统的文件会残留进下一版镜像；bin/ 也整目录清掉防清单串版。
# 成品文件名靠 -wifi / -nowifi / -nowifi-docker 后缀区分，同一个 Release 一起发布。
# 注意：Docker 只在第三版里有——标准版与无 WiFi 版 2026-11-18 已按用户要求移除 Docker
# （用户反馈 Docker 影响网络），第三版是 2026-11-23 用户单独要求加的。
name: Build LibWrt NN6000V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget libelf-dev zstd

      - name: Clone LibWrt source
        run: git clone --depth 1 https://github.com/LiBwrt/LibWrt openwrt-src

      - name: Seed dl cache
        working-directory: openwrt-src
        run: |
          mkdir -p dl
          cp "$GITHUB_WORKSPACE"/dl/*.tar.gz dl/ 2>/dev/null || true
          ls -lh dl/

      - name: Add extra feeds
        working-directory: openwrt-src
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/OpenWrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/OpenWrt-Passwall/openwrt-passwall.git;main
          EOF
          cat feeds.conf.default

      - name: Add Lucky packages
        working-directory: openwrt-src
        run: |
          git clone --depth 1 https://github.com/kenzok8/small-package.git /tmp/small-package
          cp -r /tmp/small-package/lucky package/
          cp -r /tmp/small-package/luci-app-lucky package/
          ls package/lucky package/luci-app-lucky

      - name: Add Argon config package
        working-directory: openwrt-src
        run: |
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          ls package/luci-app-argon-config

      - name: Add MosDNS packages
        working-directory: openwrt-src
        run: |
          git clone --depth 1 -b v5 https://github.com/sbwml/luci-app-mosdns.git /tmp/mosdns-repo
          cp -r /tmp/mosdns-repo/mosdns package/
          cp -r /tmp/mosdns-repo/luci-app-mosdns package/
          cp -r /tmp/mosdns-repo/geo2txt package/
          ls package/mosdns package/luci-app-mosdns package/geo2txt

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config (WiFi standard)
        working-directory: openwrt-src
        run: |
          cp "$GITHUB_WORKSPACE/configs/libwrt.config" .config
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        run: make download -j8

      - name: Compile firmware (WiFi standard)
        working-directory: openwrt-src
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect firmware files (WiFi standard)
        run: |
          mkdir -p firmware/wifi
          for f in openwrt-src/bin/targets/qualcommax/ipq60xx/*nn6000-v2*; do
            new=$(basename "$f" | sed 's/link_nn6000-v2/link_nn6000-v2-wifi/')
            cp -v "$f" "firmware/wifi/$new"
          done
          ls -lh firmware/wifi/

      - name: Switch to no-WiFi config
        working-directory: openwrt-src
        run: |
          rm -rf staging_dir/target-*/root-* build_dir/target-*/root-* bin
          cp "$GITHUB_WORKSPACE/configs/libwrt-nowifi.config" .config
          make defconfig

      - name: Compile firmware (no-WiFi)
        working-directory: openwrt-src
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect firmware files (no-WiFi)
        run: |
          mkdir -p firmware/nowifi
          for f in openwrt-src/bin/targets/qualcommax/ipq60xx/*nn6000-v2*; do
            new=$(basename "$f" | sed 's/link_nn6000-v2/link_nn6000-v2-nowifi/')
            cp -v "$f" "firmware/nowifi/$new"
          done
          ls -lh firmware/nowifi/

      - name: Switch to no-WiFi + Docker config
        working-directory: openwrt-src
        run: |
          rm -rf staging_dir/target-*/root-* build_dir/target-*/root-* bin
          cp "$GITHUB_WORKSPACE/configs/libwrt-nowifi-docker.config" .config
          make defconfig
          make download -j8

      - name: Compile firmware (no-WiFi + Docker)
        working-directory: openwrt-src
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect firmware files (no-WiFi + Docker)
        run: |
          mkdir -p firmware/nowifi-docker
          for f in openwrt-src/bin/targets/qualcommax/ipq60xx/*nn6000-v2*; do
            new=$(basename "$f" | sed 's/link_nn6000-v2/link_nn6000-v2-nowifi-docker/')
            cp -v "$f" "firmware/nowifi-docker/$new"
          done
          ls -lh firmware/nowifi-docker/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-NN6000V2
          path: firmware/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="libwrt-nn6000v2-$(date +%Y%m%d)-run${{ github.run_number }}"
          gh release create "$tag" firmware/wifi/* firmware/nowifi/* firmware/nowifi-docker/* \
            --title "LibWrt NN6000V2 $tag" \
            --notes "LibWrt (LiBwrt/LibWrt) for Link NN6000 V2, three variants in one release. Files with -wifi- = standard build (WiFi included, no Docker); files with -nowifi- = no-WiFi build (all WiFi drivers, firmware and wireless configuration removed, wired only, no Docker); files with -nowifi-docker- = no-WiFi build plus the full Docker suite (dockerd, docker, docker-compose, luci-app-dockerman). Full package set: Lucky, PassWall, Argon theme, MosDNS, ttyd, WireGuard, KMS and more. Rootfs 2GB, kernel 6MB. factory.bin = U-Boot first flash, sysupgrade.bin = upgrade from OpenWrt/ImmortalWrt."
