name: Build LibWrt NN6000V2

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: '配置文件（libwrt.config = 标准版；libwrt-nowifi.config = 无 WiFi 版）'
        type: choice
        options:
          - libwrt.config
          - libwrt-nowifi.config
        default: libwrt.config
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget libelf-dev zstd

      - name: Clone LibWrt source
        run: git clone --depth 1 https://github.com/LiBwrt/LibWrt openwrt-src

      - name: Seed dl cache
        working-directory: openwrt-src
        run: |
          mkdir -p dl
          cp "$GITHUB_WORKSPACE"/dl/*.tar.gz dl/ 2>/dev/null || true
          ls -lh dl/

      - name: Add extra feeds
        working-directory: openwrt-src
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/OpenWrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/OpenWrt-Passwall/openwrt-passwall.git;main
          EOF
          cat feeds.conf.default

      - name: Add Lucky packages
        working-directory: openwrt-src
        run: |
          git clone --depth 1 https://github.com/kenzok8/small-package.git /tmp/small-package
          cp -r /tmp/small-package/lucky package/
          cp -r /tmp/small-package/luci-app-lucky package/
          ls package/lucky package/luci-app-lucky

      - name: Add Argon config package
        working-directory: openwrt-src
        run: |
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git package/luci-app-argon-config
          ls package/luci-app-argon-config

      - name: Add MosDNS packages
        working-directory: openwrt-src
        run: |
          git clone --depth 1 -b v5 https://github.com/sbwml/luci-app-mosdns.git /tmp/mosdns-repo
          cp -r /tmp/mosdns-repo/mosdns package/
          cp -r /tmp/mosdns-repo/luci-app-mosdns package/
          cp -r /tmp/mosdns-repo/geo2txt package/
          ls package/mosdns package/luci-app-mosdns package/geo2txt

      - name: Update and install feeds
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config
        working-directory: openwrt-src
        run: |
          cp "$GITHUB_WORKSPACE/configs/${{ inputs.config_file }}" .config
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        run: make download -j8

      - name: Compile firmware
        working-directory: openwrt-src
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect firmware files
        run: |
          mkdir -p firmware
          find openwrt-src/bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -name '*nn6000-v2*' -exec cp -v {} firmware/ \;
          ls -lh firmware/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-NN6000V2
          path: firmware/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="libwrt-nn6000v2-$(date +%Y%m%d)-run${{ github.run_number }}"
          variant=""
          if [ "${{ inputs.config_file }}" = "libwrt-nowifi.config" ]; then
            tag="libwrt-nn6000v2-$(date +%Y%m%d)-nowifi-run${{ github.run_number }}"
            variant=" No-WiFi variant: all WiFi drivers, firmware and wireless configuration removed (wired only)."
          fi
          gh release create "$tag" firmware/* \
            --title "LibWrt NN6000V2 $tag" \
            --notes "LibWrt (LiBwrt/LibWrt) for Link NN6000 V2, full package set: Lucky, PassWall, Argon theme, MosDNS, ttyd, WireGuard, KMS and more. Rootfs 2GB, kernel 6MB. factory.bin = U-Boot first flash, sysupgrade.bin = upgrade from OpenWrt/ImmortalWrt.$variant"
